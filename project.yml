name: SnapTest

options:
  bundleIdPrefix: com.snaptest

targets:
  SnapTest:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ContentView.swift
      - path: SnapTestApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snaptest.app
        INFOPLIST_KEY_CFBundleDisplayName: SnapTest
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_DEBUG_DYLIB: NO  
